<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Information Form</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <h1>Student Information Form</h1>
      <p class="intro">Please complete the fields below.</p>

      <form id="student-form" class="student-form" novalidate>
        <div class="field">
          <label for="firstName">First Name</label>
          <input id="firstName" name="firstName" type="text" required />
        </div>

        <div class="field">
          <label for="lastName">Last Name</label>
          <input id="lastName" name="lastName" type="text" required />
        </div>

        <div class="field">
          <label for="studentId">Student ID</label>
          <input id="studentId" name="studentId" type="text" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>

        <div class="field">
          <label for="age">Age</label>
          <input id="age" name="age" type="number" min="5" max="120" required />
        </div>

        <div class="field">
          <label for="grade">Grade</label>
          <select id="grade" name="grade" required>
            <option value="">Select grade</option>
            <option value="Freshman">Freshman</option>
            <option value="Sophomore">Sophomore</option>
            <option value="Junior">Junior</option>
            <option value="Senior">Senior</option>
          </select>
        </div>

        <div class="field full-width">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="4" placeholder="Optional"></textarea>
        </div>

        <button type="submit">Submit</button>
      </form>

      <section id="result" class="result" hidden>
        <h2>Submitted Information</h2>
        <pre id="result-content"></pre>
      </section>
    </main>
  </body>
</html>
