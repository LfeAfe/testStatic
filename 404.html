<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <style>
      :root {
        --bg-1: #fff4e6;
        --bg-2: #ffe8cc;
        --card: #ffffff;
        --text: #2d1b12;
        --muted: #6b4f45;
        --accent: #c2410c;
        --accent-hover: #9a3412;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at 20% 20%, #ffd8a8 0%, transparent 32%),
          radial-gradient(circle at 80% 80%, #ffc078 0%, transparent 30%),
          linear-gradient(140deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      .error-card {
        width: min(620px, 100%);
        background: var(--card);
        border-radius: 16px;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      }

      .code {
        margin: 0;
        font-size: clamp(3rem, 12vw, 6rem);
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--accent);
      }

      h1 {
        margin: 0.35rem 0 0.75rem;
        font-size: clamp(1.5rem, 4vw, 2.2rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .home-link {
        display: inline-block;
        margin-top: 1.4rem;
        padding: 0.7rem 1.05rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
      }

      .home-link:hover {
        background: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <main class="error-card">
      <p class="code">404</p>
      <h1>Page Not Found</h1>
      <p>The page you were looking for does not exist, was moved, or is temporarily unavailable.</p>
      <a class="home-link" href="index.html">Back to Home</a>
    </main>
  </body>
</html>
